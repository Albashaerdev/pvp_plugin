name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B clean package
      - name: Zip datapack and resource pack
        run: |
          (cd datapack && zip -r ../PvPSMP-Datapack.zip pvpsmp_worldgen)
          (cd resourcepack && zip -r ../PvPSMP-ResourcePack.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: PvPSMP-all-files
          path: |
            target/PvPSMP.jar
            PvPSMP-Datapack.zip
            PvPSMP-ResourcePack.zip
